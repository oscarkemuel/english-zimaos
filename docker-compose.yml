services:
  server:
    build:
      context: ./server
    container_name: curso-server
    environment:
      VIDEOS_DIR: /app/videos
      DATABASE_FILE: /app/data/english.sqlite
    volumes:
      - /DATA/.media/HDD01/English/videos:/app/videos:ro
      - ./data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_SCRIPT_GOOGLE_APP: ${VITE_SCRIPT_GOOGLE_APP}
        VITE_YOUTUBE_API_KEY: ${VITE_YOUTUBE_API_KEY}
    container_name: curso-web
    ports:
      - "7777:80"
    volumes:
      - ./web/public:/usr/share/nginx/html/public-data:ro
    depends_on:
      - server
    restart: unless-stopped

  generator:
    build:
      context: ./server
    container_name: curso-generator
    environment:
      VIDEOS_DIR: /app/videos
      SERVER_URL: /videos
      JSON_OUTPUT: /app/output/curso_ingles.json
    volumes:
      - /DATA/.media/HDD01/English/videos:/app/videos
      - ./web/public:/app/output
    command: ["node", "dist/generateJson.cjs"]
    profiles:
      - tools